<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07060d">
    <title>FLAMES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="client/style.css">
    <link rel="stylesheet" href="client/flames.css">
</head>
<body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

    <main>
        <!-- 1. NAMES -->
        <section class="screen active" id="page-names">
            <h1 class="grad">FLAMES</h1>
            <p>Enter two names to find out what they are to each other.</p>
            <form id="names-form" class="names-form" autocomplete="off" novalidate>
                <input type="text" id="name1" placeholder="First name" maxlength="30" aria-label="First name">
                <input type="text" id="name2" placeholder="Second name" maxlength="30" aria-label="Second name">
                <p class="form-error" id="form-error" role="alert"></p>
                <button class="btn" type="submit">Play</button>
            </form>
        </section>

        <!-- 2. CANCEL COMMON LETTERS -->
        <section class="screen" id="page-cancel">
            <span class="meta-label">Step 1</span>
            <h2>Cancel the common letters</h2>
            <div class="letter-row" id="letters-a" aria-live="polite"></div>
            <div class="letter-row" id="letters-b"></div>
            <p id="count-text" class="count-text"></p>
            <button class="btn hidden" id="reveal-btn">Continue</button>
        </section>

        <!-- 3. ELIMINATION + RESULT -->
        <section class="screen" id="page-result">
            <span class="meta-label" id="step-label">Step 2</span>
            <h2 id="step-title">Counting through FLAMES</h2>
            <div class="flames-row" id="flames-row"></div>
            <div class="final hidden" id="final">
                <span class="meta-label">You two are</span>
                <h1 class="grad" id="result-message"></h1>
                <button class="btn" id="restart-btn">Play again</button>
            </div>
        </section>
    </main>

    <script src="client/script.js"></script>
</body>
</html>
